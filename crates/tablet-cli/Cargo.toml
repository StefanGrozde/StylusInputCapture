[package]
name = "tablet-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tablet-cli"
path = "src/main.rs"

# `backend-rawinput` is the default Windows capture path (SPEC_BGC). It pulls a
# Windows-only optional dependency, so on non-Windows targets the feature is inert
# (the dep isn't compiled) and the CLI falls back to the mock backend.
[features]
default = ["backend-rawinput"]
backend-rawinput = ["dep:tablet-rawinput", "tablet-rawinput/backend-rawinput"]
backend-evdev = ["dep:tablet-evdev", "tablet-evdev/backend-evdev"]
backend-macos = ["dep:tablet-macos", "tablet-macos/backend-macos"]
# Deprecated for capture (SPEC_BGC §1): Wintab can't capture in the background.
# Kept opt-in for reference/fallback only.
backend-wintab = ["dep:tablet-wintab"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.2"
rtrb = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
tablet-core = { version = "0.1.0", path = "../tablet-core" }
tablet-evdev = { version = "0.1.0", path = "../tablet-evdev", optional = true }
tablet-macos = { version = "0.1.0", path = "../tablet-macos", optional = true }
tablet-stream = { version = "0.1.0", path = "../tablet-stream" }
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
tablet-rawinput = { version = "0.1.0", path = "../tablet-rawinput", optional = true }
tablet-wintab = { version = "0.1.0", path = "../tablet-wintab", optional = true }
