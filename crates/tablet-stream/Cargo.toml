[package]
name = "tablet-stream"
version = "0.1.0"
edition = "2021"

[dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tablet-core = { version = "0.1.0", path = "../tablet-core" }
thiserror = "2.0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security"] }
